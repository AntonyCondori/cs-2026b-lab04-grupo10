    "description": "LLMApiSimulada.predecir_categoria",
    "vars": {
      "id": "DOC-03",
      "codigo": "def predecir_categoria(self, texto: str) -> dict:\n    self.llamadas += 1\n    if self.llamadas <= self.fallas:\n        raise TimeoutError(\"Conexión perdida con la IA\")\n\n    # Simulamos respuestas poco confiables de la IA\n    texto_lower = texto.lower()\n    if \"botella\" in texto_lower:\n        return {\"status\": \"ok\", \"result\": \"PLASTICO\"}\n    elif \"bateria\" in texto_lower:\n        return {\"status\": \"ok\", \"result\": \"PELIGROSO - S/ 50.00\"} # IA inventando cosas\n    return {\"status\": \"ok\", \"result\": \"DESCONOCIDO\"}",
      "ruta": "src/solicitudes/externos.py",
      "simbolo": "LLMApiSimulada.predecir_categoria",
      "parametros_reales": [
        "texto"
      ],
      "retorno_esperado": "dict",
      "excepciones_esperadas": [
        "TimeoutError"
      ],
      "comportamiento_esperado": "Devuelve una predicción simulada o agota el tiempo mientras quedan fallas configuradas."
    }
  },
