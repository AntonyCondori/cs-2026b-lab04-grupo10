name: fitness-functions

on: [pull_request, push]

permissions:
  contents: read

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: python -m pip install pytest==9.2.0 import-linter==2.15
      - name: Contratos FF-01 y FF-02
        run: lint-imports --no-cache
      - name: Fitness FF-03 a FF-05 y controles adicionales
        run: python -m pytest -v -p no:cacheprovider tests/test_fitness.py
      - name: Regresion del proyecto
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_fitness.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eco_test
          POSTGRES_PASSWORD: eco_test
          POSTGRES_DB: ecorecicla_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U eco_test -d ecorecicla_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas de integración
        run: python -m pip install pytest==9.2.0 "psycopg[binary]==3.3.9"
      - name: Verificar persistencia, reenvíos y aislamiento
        run: python -m pytest -v tests/test_recojo_postgres.py
        env:
          ECORECICLA_POSTGRES_DSN: postgresql://eco_test:eco_test@localhost:${{ job.services.postgres.ports[5432] }}/ecorecicla_test
