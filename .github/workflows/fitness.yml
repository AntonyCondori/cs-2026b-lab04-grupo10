name: fitness-functions

on: [pull_request, push]

permissions:
  contents: read

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: python -m pip install pytest==9.2.0 import-linter==2.15
      - name: Contratos FF-01 y FF-02
        run: lint-imports --no-cache
      - name: Fitness FF-03 a FF-05 y controles adicionales
        run: python -m pytest -v -p no:cacheprovider tests/test_fitness.py
      - name: Regresion del proyecto
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_fitness.py
